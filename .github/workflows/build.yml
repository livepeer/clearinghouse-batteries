name: Build

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  package:
    uses: ./.github/workflows/package.yml
    with:
      bundles: ${{ github.event_name != 'push' }}
      export_images: ${{ github.event_name == 'push' }}

  package-gate:
    name: package-gate
    if: always()
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both Linux builds and smoke tests to succeed
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: test "$PACKAGE_RESULT" = success

  docker:
    needs: [checks, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
    with:
      commit: ${{ github.sha }}
      version: ${{ needs.package.outputs.version }}
      target: main
