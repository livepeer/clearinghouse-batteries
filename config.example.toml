# Persistent accounting database. Keep it on a local filesystem.
DBPath = "clearinghouse.db"

# Enable one or more serve components.
EnableAuthWebhook = ":8080"
# EnableManagementAPI = ":8081" # Management API on a separate port.
EnableKafka = true
EnableAccounting = true
EnableOnchainListener = false

# Set CLEARINGHOUSE_WEBHOOK_TOKEN in the environment when the webhook is enabled,
# or point at a mounted secret file.
# WebhookTokenFile = "/run/secrets/clearinghouse-webhook-token"
# Non-loopback and wildcard HTTP binds additionally require UnsafeHTTPBind = true.
# UnsafeHTTPBind = true

# The embedded Kafka broker should listen only on a trusted loopback or private network.
KafkaBind = "127.0.0.1:9092"
KafkaTopic = "livepeer-signing"

# For external plaintext Kafka, set EnableKafka = false, keep EnableAccounting = true,
# and provide its address. Do not use KafkaBroker with embedded Kafka.
# KafkaBroker = "broker:9092"

# On-chain listener settings. An RPC URL and SignerAddresses are required when enabled.
# Set CLEARINGHOUSE_RPC_URL or point at a mounted secret file.
# RPCURLFile = "/run/secrets/clearinghouse-rpc-url"
# SignerAddresses = ["0xYOUR_SIGNER"]
# ChainID = "42161"       # Optional RPC chain assertion.
# TicketBroker = "0x..."  # Optional override on Arbitrum One.
# StartBlock = 123456789   # Omit to start a new database at the current head.
Confirmations = 64

# Durations use Go duration syntax.
PollInterval = "5s"
BlockBatchSize = 2000
ReorgLookback = 256
